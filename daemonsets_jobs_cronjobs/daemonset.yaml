# DaemonSet "node-agent": a tiny "node agent" that prints the node name.
# Runs one Pod on every node.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-agent
  namespace: kube-system       # agents often live here; any ns works
spec:
  selector:
    matchLabels:
      app: node-agent
  template:
    metadata:
      labels:
        app: node-agent        # must match selector
    spec:
      tolerations:             # also run on control-plane nodes
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: agent
          image: busybox:1.36
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName   # Downward API: my node
          command: ["sh", "-c",
            "while true; do echo agent on $NODE_NAME; sleep 30; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 50m, memory: 32Mi}
          volumeMounts:
            - name: varlog
              mountPath: /host/var/log       # read node logs
              readOnly: true
      volumes:
        - name: varlog
          hostPath:
            path: /var/log                   # folder on the node
