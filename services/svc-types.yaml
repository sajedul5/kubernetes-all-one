apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
  - port: 80                 # ClusterIP port (inside cluster)
    targetPort: 80           # container port
    nodePort: 30080          # optional; 30000-32767; random if empty
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
spec:
  type: LoadBalancer         # needs cloud LB or "minikube tunnel"
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-headless
spec:
  clusterIP: None            # headless: DNS returns Pod IPs
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: external-api
spec:
  type: ExternalName         # DNS CNAME, no selector, no proxy
  externalName: api.github.com
