apiVersion: v1
kind: Pod
metadata:
  name: web-dev
  labels:                       # used for grouping and selecting
    app: nginx
    env: dev
    tier: frontend
  annotations:                  # extra info, NOT for selecting
    description: "Dev web server for the labels lab"
    owner: "team-a@example.com"
spec:
  containers:
  - name: nginx
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: web-prod
  labels:
    app: nginx
    env: prod
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: db-dev
  labels:
    app: postgres
    env: dev
    tier: backend
spec:
  containers:
  - name: postgres
    image: postgres:16
    env:
    - name: POSTGRES_PASSWORD   # demo only; use a Secret (topic 10)
      value: "demo"
