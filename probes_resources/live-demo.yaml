# Pod "live-demo": liveness probe fails after ~30s -> container restarts.
apiVersion: v1
kind: Pod
metadata:
  name: live-demo
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c",
        "touch /tmp/healthy; sleep 30; rm /tmp/healthy; sleep 600"]
      livenessProbe:
        exec:
          command: ["cat", "/tmp/healthy"]   # exit 0 = alive
        initialDelaySeconds: 5
        periodSeconds: 5
