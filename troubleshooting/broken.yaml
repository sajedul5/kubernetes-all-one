# Broken examples for troubleshooting practice. Each object shows a different error.
# Apply: kubectl apply -f troubleshooting/broken.yaml
---
# A) ImagePullBackOff - tag does not exist
apiVersion: v1
kind: Pod
metadata:
  name: bad-image
spec:
  containers:
  - name: web
    image: nginx:1.27.99-doesnotexist   # wrong tag
---
# B) CrashLoopBackOff - app exits with error
apiVersion: v1
kind: Pod
metadata:
  name: crashy
spec:
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "echo starting; sleep 3; echo boom; exit 1"]
---
# C) OOMKilled - uses more memory than the limit
apiVersion: v1
kind: Pod
metadata:
  name: memory-hog
spec:
  containers:
  - name: hog
    image: busybox:1.36
    command: ["sh", "-c", "tail /dev/zero"]  # eats memory fast
    resources:
      limits:
        memory: 64Mi                         # killed above 64Mi
---
# D) CreateContainerConfigError - ConfigMap does not exist
apiVersion: v1
kind: Pod
metadata:
  name: missing-config
spec:
  containers:
  - name: web
    image: nginx:1.27.2
    env:
    - name: MODE
      valueFrom:
        configMapKeyRef:
          name: app-config                  # not created
          key: mode
---
# E) Pending - asks for more CPU than any node has
apiVersion: v1
kind: Pod
metadata:
  name: too-big
spec:
  containers:
  - name: web
    image: nginx:1.27.2
    resources:
      requests:
        cpu: "100"                           # 100 cores!
---
# F) PVC Pending - StorageClass does not exist
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
spec:
  storageClassName: fast-ssd-missing        # wrong class name
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
# G) Service with NO endpoints - selector typo
apiVersion: v1
kind: Service
metadata:
  name: broken-svc
spec:
  selector:
    app: ngnix                               # typo: nginx Pods not found
  ports:
  - port: 8080
    targetPort: 80
